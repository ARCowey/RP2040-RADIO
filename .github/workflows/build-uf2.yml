name: Build RP2040-Zero GP6 FM UF2

on:
  push:
    branches: [main, gp6-usb-fm]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3

      - name: Fetch Pico SDK and upstream FM sources
        run: |
          git clone --depth 1 --branch 2.1.0 https://github.com/raspberrypi/pico-sdk.git
          git -C pico-sdk submodule update --init --depth 1
          git clone https://github.com/kaduhi/pico-extras.git
          git -C pico-extras checkout 6a53bc4d89e087ce416fdfa84b197569f15201f8
          git -C pico-extras submodule update --init --recursive
          git clone https://github.com/kaduhi/pico-playground.git
          git -C pico-playground checkout 3d80b25a8c3f685947d357f418498a7c535c1500

      - name: Apply GP6 / 90 MHz adaptation
        run: python3 scripts/patch_upstreams.py

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          PICO_EXTRAS_PATH: ${{ github.workspace }}/pico-extras
        run: |
          cmake -S pico-playground -B build -G Ninja -DPICO_BOARD=pico -DCMAKE_BUILD_TYPE=Release

      - name: Build USB FM transmitter
        run: cmake --build build --target usb_sound_card_fm_transmitter -j2

      - name: Collect UF2
        run: |
          mkdir -p dist
          cp build/apps/usb_sound_card/usb_sound_card_fm_transmitter.uf2 dist/RP2040-Zero-GP6-90MHz-USB-Audio.uf2
          sha256sum dist/*.uf2 | tee dist/SHA256SUMS.txt

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: RP2040-Zero-GP6-90MHz-USB-Audio
          path: dist/
          if-no-files-found: error
